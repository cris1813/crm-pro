name: Build CRM APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar tu codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Generar arquitectura Android + Inyectar AccessibilityService
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --org com.cristobal.crm --project-name crm_mayorista_pro .
          cp /tmp/main.dart lib/main.dart

          flutter pub add url_launcher shared_preferences path_provider http

          mkdir -p android/app/src/main/res/xml

          cat << 'EOF' > android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:packageNames="com.whatsapp,com.whatsapp.w4b" />
          EOF

          KOTLIN_DIR=$(dirname $(find android/app/src/main -name "MainActivity.kt"))
          PACKAGE_NAME=$(head -n 1 $(find android/app/src/main -name "MainActivity.kt") | sed 's/package //g' | tr -d '\r')

          cat << EOF > "$KOTLIN_DIR/WhatsAppAccessibilityService.kt"
          package $PACKAGE_NAME

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class WhatsAppAccessibilityService : AccessibilityService() {
              companion object {
                  var autoSendActive: Boolean = false
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!autoSendActive) return
                  val rootNode = rootInActiveWindow ?: return

                  val sendNodes = mutableListOf<AccessibilityNodeInfo>()
                  sendNodes.addAll(rootNode.findAccessibilityNodeInfosByViewId("com.whatsapp:id/send"))
                  sendNodes.addAll(rootNode.findAccessibilityNodeInfosByViewId("com.whatsapp.w4b:id/send"))
                  sendNodes.addAll(rootNode.findAccessibilityNodeInfosByText("Enviar"))
                  sendNodes.addAll(rootNode.findAccessibilityNodeInfosByText("Send"))

                  for (node in sendNodes) {
                      if (node.isClickable && node.isEnabled) {
                          autoSendActive = false
                          Handler(Looper.getMainLooper()).postDelayed({
                              node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                              Handler(Looper.getMainLooper()).postDelayed({
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  Handler(Looper.getMainLooper()).postDelayed({
                                      performGlobalAction(GLOBAL_ACTION_BACK)
                                  }, 500)
                              }, 700)
                          }, 500)
                          break
                      }
                  }
              }

              override fun onInterrupt() {}
          }
          EOF

          cat << EOF > "$KOTLIN_DIR/MainActivity.kt"
          package $PACKAGE_NAME

          import android.content.Intent
          import android.provider.Settings
          import android.text.TextUtils
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.cristobal.crm/accessibility"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openAccessibilitySettings" -> {
                              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "armAutoSend" -> {
                              WhatsAppAccessibilityService.autoSendActive = true
                              result.success(true)
                          }
                          "isServiceEnabled" -> {
                              result.success(isAccessibilityServiceEnabled())
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  val expectedComponentName = "$packageName/\${WhatsAppAccessibilityService::class.java.canonicalName}"
                  val enabledServicesSetting = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val colonSplitter = TextUtils.SimpleStringSplitter(':')
                  colonSplitter.setString(enabledServicesSetting)
                  while (colonSplitter.hasNext()) {
                      val componentName = colonSplitter.next()
                      if (componentName.equals(expectedComponentName, ignoreCase = true)) {
                          return true
                      }
                  }
                  return false
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                      <data android:scheme="tel" />
                  </intent>
              </queries>
              <application
                  android:label="CRM Mayorista Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WhatsAppAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:label="CRM Mayorista Auto-WhatsApp"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: 5. Compilar APK Release
        run: flutter build apk --release

      - name: 6. Subir APK listo para descargar en el celular
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Mayorista-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
